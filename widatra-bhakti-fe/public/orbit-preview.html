<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Drag-to-Orbit Wheel Carousel — Velocity Labs</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #07090e;
      color: #ffffff;
      overflow-x: hidden;
    }
    .orbit-stage {
      perspective: 1300px;
      transform-style: preserve-3d;
    }
    .orbit-card {
      transform-style: preserve-3d;
      will-change: transform, opacity;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8 relative">
  <!-- Ambient Studio Lighting -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-blue-600/10 blur-[130px] rounded-full"></div>
    <div class="absolute top-[60%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[750px] h-[300px] bg-gradient-to-tr from-cyan-600/20 via-blue-600/15 to-purple-600/10 blur-[90px] rounded-[50%]"></div>
    <div class="absolute top-[58%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[780px] h-[320px] rounded-[50%] border border-cyan-500/20 shadow-[0_0_40px_rgba(6,182,212,0.12)] [transform:rotateX(72deg)]"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 max-w-6xl mx-auto w-full flex items-center justify-between">
    <div>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        <span class="text-[10px] font-mono font-bold tracking-[0.22em] text-cyan-400 uppercase">3D ORBIT ENGINE · 60 FPS</span>
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight mt-0.5">
        VELOCITY <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">LABS</span>
      </h1>
    </div>
    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/[0.04] border border-white/10 text-xs text-slate-300">
      <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
      <span>Drag horizontal atau scroll roda untuk memutar</span>
    </div>
  </header>

  <!-- 3D Orbit Stage -->
  <main class="relative z-10 flex-1 flex items-center justify-center my-6">
    <div id="orbit-stage" class="relative w-full max-w-5xl h-[480px] flex items-center justify-center cursor-grab active:cursor-grabbing touch-none select-none orbit-stage">
      <div id="cards-container" class="relative w-full h-full flex items-center justify-center pointer-events-auto">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <!-- Bottom HUD & Navigation -->
  <footer class="relative z-10 max-w-6xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div id="status-dot" class="w-3.5 h-3.5 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee]"></div>
      <div>
        <div class="text-[9px] font-mono uppercase tracking-widest text-slate-400" id="hud-index">Active Focus (1/6)</div>
        <div class="text-sm font-extrabold text-white" id="hud-title">AeroPulse Cyber V1 · <span class="text-cyan-400">$280</span></div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="prevItem()" class="w-10 h-10 rounded-full bg-white/[0.06] border border-white/15 text-white hover:bg-cyan-500 hover:text-slate-950 transition-all flex items-center justify-center text-sm active:scale-95 shadow-lg">
        ❮
      </button>
      <div id="dots-container" class="flex items-center gap-1.5 px-3 py-2 rounded-full bg-white/[0.05] border border-white/10 backdrop-blur-md"></div>
      <button onclick="nextItem()" class="w-10 h-10 rounded-full bg-white/[0.06] border border-white/15 text-white hover:bg-cyan-500 hover:text-slate-950 transition-all flex items-center justify-center text-sm active:scale-95 shadow-lg">
        ❯
      </button>
    </div>
  </footer>

  <script>
    const PRODUCTS = [
      {
        id: 1,
        name: "AeroPulse Cyber V1",
        tag: "Futuristic Runner",
        price: "$280",
        color: "#3B82F6",
        image: "https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 2,
        name: "Phantom Stealth Pro",
        tag: "Carbon Fiber Road",
        price: "$340",
        color: "#EF4444",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 3,
        name: "HyperGlide Neon Flux",
        tag: "High-Top Court",
        price: "$310",
        color: "#10B981",
        image: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 4,
        name: "Vortex Velocity 90",
        tag: "Ultra-Lightweight Track",
        price: "$295",
        color: "#F59E0B",
        image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 5,
        name: "Zenith Kinetic Apex",
        tag: "Limited Studio Edition",
        price: "$420",
        color: "#8B5CF6",
        image: "https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?auto=format&fit=crop&w=500&q=80"
      },
      {
        id: 6,
        name: "Quantum Stride Shift",
        tag: "Adaptive Cushioning",
        price: "$260",
        color: "#EC4899",
        image: "https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=500&q=80"
      }
    ];

    const N = PRODUCTS.length;
    const angleStep = (2 * Math.PI) / N;

    let currentAngle = 0;
    let targetAngle = null;
    let velocity = 0;
    let isDragging = false;
    let startX = 0;
    let lastX = 0;
    let activeIndex = 0;

    let cfg = {
      radiusX: window.innerWidth < 640 ? 170 : 380,
      radiusY: window.innerWidth < 640 ? 40 : 75,
      depthZ: window.innerWidth < 640 ? 130 : 250,
      tilt: 0.35,
      friction: 0.92,
      snapSpring: 0.08
    };

    window.addEventListener('resize', () => {
      cfg.radiusX = window.innerWidth < 640 ? 170 : 380;
      cfg.radiusY = window.innerWidth < 640 ? 40 : 75;
      cfg.depthZ = window.innerWidth < 640 ? 130 : 250;
    });

    const container = document.getElementById('cards-container');
    const dotsCont = document.getElementById('dots-container');
    const cardNodes = [];

    // Build DOM elements once
    PRODUCTS.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = "orbit-card absolute w-[260px] sm:w-[290px] h-[370px] sm:h-[400px] rounded-[30px] p-5 flex flex-col justify-between backdrop-blur-xl border border-white/15 bg-gradient-to-b from-white/[0.08] to-white/[0.02] shadow-[0_30px_70px_rgba(0,0,0,0.8)] cursor-pointer";
      card.innerHTML = `
        <div class="flex items-center justify-between text-xs">
          <span class="px-2.5 py-0.5 rounded-full bg-white/[0.08] border border-white/10 text-[9px] font-bold tracking-wider uppercase text-cyan-300">${p.tag}</span>
          <span class="font-mono text-[10px] text-slate-400">0${i+1}</span>
        </div>
        <div class="relative my-auto flex items-center justify-center py-2">
          <div class="absolute w-28 h-28 rounded-full blur-2xl opacity-40" style="background-color: ${p.color}"></div>
          <img src="${p.image}" alt="${p.name}" class="relative z-10 w-full h-36 object-contain filter drop-shadow-[0_15px_20px_rgba(0,0,0,0.6)]" draggable="false" />
        </div>
        <div class="pt-2 border-t border-white/10">
          <h3 class="text-base font-bold tracking-tight text-white line-clamp-1">${p.name}</h3>
          <div class="flex items-center justify-between mt-1.5">
            <span class="text-lg font-black text-white">${p.price}</span>
            <span class="px-3 py-1 rounded-full bg-cyan-500 text-slate-950 text-[10px] font-extrabold shadow-[0_0_15px_rgba(6,182,212,0.5)]">VIEW</span>
          </div>
        </div>
      `;

      card.addEventListener('click', () => {
        rotateToIndex(i);
      });

      container.appendChild(card);
      cardNodes.push(card);

      const dot = document.createElement('button');
      dot.className = "h-1.5 w-1.5 rounded-full bg-white/20";
      dot.onclick = () => rotateToIndex(i);
      dotsCont.appendChild(dot);
    });

    function updatePositions() {
      const nearestStep = Math.round(-currentAngle / angleStep);
      const frontIndex = ((-nearestStep % N) + N) % N;

      if (frontIndex !== activeIndex) {
        activeIndex = frontIndex;
        const cur = PRODUCTS[activeIndex];
        document.getElementById('hud-index').textContent = `Active Focus (${activeIndex + 1}/${N})`;
        document.getElementById('hud-title').innerHTML = `${cur.name} · <span class="text-cyan-400">${cur.price}</span>`;
        document.getElementById('status-dot').style.backgroundColor = cur.color;
        document.getElementById('status-dot').style.boxShadow = `0 0 12px ${cur.color}`;

        const dots = dotsCont.children;
        for (let j = 0; j < N; j++) {
          dots[j].className = j === activeIndex ? "h-1.5 w-5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] transition-all" : "h-1.5 w-1.5 rounded-full bg-white/20 transition-all";
        }
      }

      for (let i = 0; i < N; i++) {
        const itemAngle = currentAngle + i * angleStep;
        const wrapped = ((((itemAngle + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;

        const sinVal = Math.sin(wrapped);
        const cosVal = Math.cos(wrapped);

        const x = sinVal * cfg.radiusX;
        const y = -cosVal * cfg.radiusY * cfg.tilt;
        const z = cosVal * cfg.depthZ;

        const depth = (cosVal + 1) / 2; // 0 to 1
        const scale = 0.70 + depth * 0.40; // 0.70 to 1.10
        const opacity = 0.45 + Math.pow(depth, 1.8) * 0.55;
        const rotY = -sinVal * 28;
        const zIndex = Math.round((z + cfg.depthZ) * 10);

        const el = cardNodes[i];
        el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotateY(${rotY}deg) scale(${scale})`;
        el.style.opacity = opacity;
        el.style.zIndex = zIndex;

        if (i === activeIndex) {
          el.style.borderColor = "rgba(34, 211, 238, 0.8)";
          el.style.boxShadow = "0 0 50px rgba(6, 182, 212, 0.35)";
        } else {
          el.style.borderColor = "rgba(255, 255, 255, 0.15)";
          el.style.boxShadow = "0 30px 70px rgba(0,0,0,0.8)";
        }
      }
    }

    // Main 60 FPS loop
    function loop() {
      if (isDragging) {
        targetAngle = null;
      } else if (targetAngle !== null) {
        const diff = targetAngle - currentAngle;
        if (Math.abs(diff) > 0.0005) {
          currentAngle += diff * cfg.snapSpring;
        } else {
          currentAngle = targetAngle;
          targetAngle = null;
        }
      } else {
        if (Math.abs(velocity) > 0.0008) {
          currentAngle += velocity;
          velocity *= cfg.friction;
        } else {
          velocity = 0;
          const nearest = Math.round(-currentAngle / angleStep);
          targetAngle = -nearest * angleStep;
        }
      }

      updatePositions();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Interaction Handlers
    const stage = document.getElementById('orbit-stage');
    stage.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      lastX = e.clientX;
      velocity = 0;
      targetAngle = null;
      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      const sens = 0.004;
      currentAngle += dx * sens;
      velocity = dx * sens;
    });

    stage.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try { stage.releasePointerCapture(e.pointerId); } catch(err) {}
    });

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      velocity += d * -0.0003;
      targetAngle = null;
    }, { passive: false });

    function rotateToIndex(idx) {
      const nearest = Math.round(-currentAngle / angleStep);
      const curFront = ((-nearest % N) + N) % N;
      let diff = idx - curFront;
      if (diff > N / 2) diff -= N;
      if (diff < -N / 2) diff += N;
      targetAngle = -(nearest + diff) * angleStep;
      velocity = 0;
    }

    function prevItem() {
      rotateToIndex((activeIndex - 1 + N) % N);
    }

    function nextItem() {
      rotateToIndex((activeIndex + 1) % N);
    }
  </script>
</body>
</html>
